[package]
name = "sprout-prober"
version = "0.4.0"
edition = "2024"
description = "SPROUT - System Probing Output diagnostic tool for debugging"
license = "GPL-3.0-only"
repository = "https://codeberg.org/cerealdevv/sprout"
readme = "README.md"
keywords = ["system-info", "diagnostics", "debugging", "probe", "cross-platform"]
categories = ["command-line-utilities", "development-tools::debugging", "os"]
exclude = ["makefile", "rustfmt.toml", ".gitignore", "CONTRIBUTING.md", "PACKAGING.md"]

[[bin]]
name = "sprout"
path = "src/main.rs"

[dependencies]
rustix = { version = "1.1.5", default-features = false, features=["net"], optional = true }
toml = { version = "0.8", default-features = false, features = ["parse"], optional = true }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"]}
x11rb = { version = "0.14.0", default-features = false, optional = true }
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"], optional = true }

[features]
default = ["verbosity", "project", "wayland", "x11"]
nox11 = ["verbosity", "project", "wayland"] # all defaults EXCEPT x11.
nowayland = ["verbosity", "project", "x11"] # all defaults EXCEPT wayland
flags = ["dep:clap"] # note that certain features DEPEND on flags, you should not explicitly disable flags when compiling with a flag dependant feature.
verbosity = ["flags"] # this feature adds the -v flag, which otherwise is not included.
x11 = ["dep:x11rb"]
wayland = ["dep:rustix"]
project = ["dep:toml"]
