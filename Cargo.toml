[package]
name = "sprout-prober"
version = "0.3.13"
edition = "2024"
description = "sprout - system probe output"
license = "GPL-3.0-only"
repository = "https://codeberg.org/cerealdevv/sprout"
readme = "README.md"
keywords = ["system-info", "diagnostics", "debugging", "probe", "cross-platform"]
categories = ["command-line-utilities", "development-tools::debugging", "os"]
exclude = ["makefile", "rustfmt.toml", ".gitignore", "CONTRIBUTING.md", "PACKAGING.md"]

[[bin]]
name = "sprout"
path = "src/main.rs"

[dependencies]
rustix = { version = "1.1.5", features=["process", "net"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
sysinfo = "0.39.6"
x11rb = { version = "0.14.0", optional = true }
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"], optional = true }

[features]
default = ["verbosity", "x11"]
nox11 = ["verbosity"] # all defaults EXCEPT x11, not reccomended outside of non UNIX, wayland or apple systems.
flags = ["dep:clap"] # note that certain features DEPEND on flags, you should not explicitly disable flags when compiling with a flag dependant feature.
verbosity = ["flags"] # this feature adds the -v flag, which otherwise is not included.
x11 = ["dep:x11rb"]
