[package]
name = "sprout-prober"
version = "0.4.0-wip"
edition = "2024"
description = "sprout - system probe output"
license = "GPL-3.0-only"
repository = "https://codeberg.org/cerealdevv/sprout"
readme = "README.md"
keywords = ["system-info", "diagnostics", "debugging", "probe", "cross-platform"]
categories = ["command-line-utilities", "development-tools::debugging", "os"]
exclude = ["makefile", "rustfmt.toml", ".gitignore", "CONTRIBUTING.md", "PACKAGING.md"]

[[bin]]
name = "sprout"
path = "src/main.rs"

[dependencies]
rustix = { version = "1.1.5", features=["process"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
sysinfo = "0.39.6"
x11rb = "0.14.0"

[features]
default = []

